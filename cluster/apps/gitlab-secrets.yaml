apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-secrets
  namespace: gitlab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:alaureijs/homelab.git
    targetRevision: HEAD
    path: cluster/base/gitlab/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
