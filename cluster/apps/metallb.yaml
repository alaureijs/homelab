apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: metallb-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - chart: metallb
      repoURL: https://metallb.github.io/metallb
      targetRevision: "0.16.1"
      helm:
        valueFiles:
          - $values/cluster/base/metallb/values.yaml
    - repoURL: git@github.com:alaureijs/homelab.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:alaureijs/homelab.git
      targetRevision: HEAD
      path: cluster/base/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
