configs:
  params:
    server.insecure: true
  secret:
    argocdServerAdminPassword: "$2b$10$v/32X8zPmOzFUgQlpE1j9ubodUoEoegA4Yhu4n3VnMn.4AD63HEIa"
  cm:
    "kustomize.buildOptions": "--enable-alpha-plugins --enable-exec"
    "application.namespaces": "argocd,monitoring,observability"
controller:
  replicas: 1
server:
  replicas: 1
  insecure: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.homelab.internal
    tls: true
    tlsSecretName: argocd-server-tls
    annotations:
      cert-manager.io/cluster-issuer: step-ca
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
repoServer:
  replicas: 1
  env:
    - name: XDG_CONFIG_HOME
      value: /.config
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: argocd-sops-age-key
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /.config/sops/age
      name: sops-age
