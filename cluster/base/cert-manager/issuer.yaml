apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca
spec:
  acme:
    server: https://pki.homelab.internal/acme/acme/directory
    email: admin@homelab.internal
    caBundle: 
    privateKeySecretRef:
      name: step-ca-acme-key
    solvers:
      - http01:
          ingress:
            ingressClassName: cilium
