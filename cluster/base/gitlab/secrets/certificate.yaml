apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-tls
  namespace: gitlab
spec:
  secretName: gitlab-tls
  commonName: gitlab.homelab.internal
  dnsNames:
    - gitlab.homelab.internal
    - registry.gitlab.homelab.internal
  issuerRef:
    name: step-ca
    kind: ClusterIssuer
