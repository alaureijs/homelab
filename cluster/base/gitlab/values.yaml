global:
  hosts:
    domain: homelab.internal
    https: true
    gitlab:
      name: gitlab.homelab.internal
    registry:
      name: registry.gitlab.homelab.internal
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false
  ingress:
    enabled: true
    class: traefik
    provider: traefik
    tls:
      enabled: true
      secretName: gitlab-tls
  psql:
    host: postgresql.gitlab.svc.cluster.local
    port: 5432
    username: gitlab
    database: gitlabhq_production
    password:
      secret: gitlab-postgresql
      key: password
  redis:
    host: redis-master.gitlab.svc.cluster.local
    port: 6379
    auth:
      enabled: true
      secret: gitlab-redis
      key: redis-password
  appConfig:
    object_store:
      enabled: true
      connection:
        secret: gitlab-object-store
        key: connection
    lfs:
      enabled: true
      bucket: gitlab-lfs
    artifacts:
      enabled: true
      bucket: gitlab-artifacts
    uploads:
      enabled: true
      bucket: gitlab-uploads
    packages:
      enabled: true
      bucket: gitlab-packages
  rails:
    bootsnap:
      enabled: false
  gitaly:
    storage:
      - name: default
        path: /home/git/repositories
  nodeSelector:
    kubernetes.io/hostname: ansible08
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  storageClass: longhorn

installCertmanager: false

certmanager:
  installCRDs: false
  nameOverride: certmanager
  config:
    enableGatewayAPI: false

prometheus:
  install: false

nginx-ingress:
  enabled: false

gitlab-zoekt:
  install: false

gitlab-runner:
  install: true
  rbac:
    create: true
  runners:
    locked: false
  podAnnotations:
    gitlab.com/prometheus_scrape: "true"
    gitlab.com/prometheus_port: 9252
  podSecurityContext:
    seccompProfile:
      type: "RuntimeDefault"

registry:
  storage:
    secret: gitlab-registry-storage
    key: config
  service:
    internalPort: 5000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

gitlab:
  webservice:
    deployment:
      readinessProbe:
        initialDelaySeconds: 60
    workhorse:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1024Mi
    minReplicas: 1
    maxReplicas: 3
    hpa:
      cpu:
        targetAverageValue: 80m
  sidekiq:
    minReplicas: 1
    maxReplicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1024Mi
  gitaly:
    persistence:
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1024Mi
  toolbox:
    backups:
      objectStorage:
        backend: s3
        config:
          secret: gitlab-object-store
          key: connection
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
