apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: observability
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.157.0
  env:
    - name: ELASTIC_PASSWORD
      valueFrom:
        secretKeyRef:
          name: observability-es-elastic-user
          key: elastic
  volumeMounts:
    - name: es-ca
      mountPath: /etc/es-ca
      readOnly: true
    - name: varlog
      mountPath: /var/log
      readOnly: true
    - name: journal
      mountPath: /var/log/journal
      readOnly: true
    - name: run-log-journal
      mountPath: /run/log/journal
      readOnly: true
  volumes:
    - name: es-ca
      secret:
        secretName: observability-es-http-ca-internal
    - name: varlog
      hostPath:
        path: /var/log
    - name: journal
      hostPath:
        path: /var/log/journal
    - name: run-log-journal
      hostPath:
        path: /run/log/journal
  config:
    receivers:
      journald:
        directory: /run/log/journal
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
    processors:
      resourcedetection:
        detectors:
          - system
        system:
          resource_attributes:
            host.name:
              enabled: true
      batch:
        send_batch_size: 512
        timeout: 5s
    exporters:
      elasticsearch:
        endpoint: https://observability-es-http:9200
        user: elastic
        password: ${env:ELASTIC_PASSWORD}
        mapping:
          mode: otel
        tls:
          ca_file: /etc/es-ca/tls.crt
    service:
      pipelines:
        logs:
          receivers:
            - journald
            - filelog
          processors:
            - resourcedetection
            - batch
          exporters:
            - elasticsearch
