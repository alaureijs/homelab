apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: observability
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.157.0
  env:
    - name: ELASTIC_PASSWORD
      valueFrom:
        secretKeyRef:
          name: observability-es-elastic-user
          key: elastic
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
  config:
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
    processors:
      resourcedetection:
        detectors:
          - system
        system:
          resource_attributes:
            host.name:
              enabled: true
      batch:
        send_batch_size: 512
        timeout: 5s
    exporters:
      elasticsearch:
        endpoint: http://observability-es-http:9200
        user: elastic
        password: ${env:ELASTIC_PASSWORD}
        mapping:
          mode: otel
    service:
      pipelines:
        logs:
          receivers:
            - filelog
          processors:
            - resourcedetection
            - batch
          exporters:
            - elasticsearch
