---
ansible_user: root
ansible_python_interpreter: /usr/bin/python3

# Domain
lab_domain: homelab.internal

# Harbor
harbor_hostname: harbor.homelab.internal
harbor_metrics_port: 8090

# Timezone
timezone: Europe/Amsterdam

# Packages to remove across all hosts
common_remove_packages:
  - cockpit
  - cockpit-bridge
  - cockpit-system
  - cockpit-ws
  - cockpit-ws-selinux

# Centralized version management
# Single source of truth for all component versions.
# Update here to bump versions across the entire project.

# Platform
harbor_version: "v2.11.0"

# PKI
step_ca_version: "0.30.2"
step_cli_version: "0.30.6"

# Monitoring stack
grafana_version: "13.1.1"
prometheus_version: "v3.13.1"
alertmanager_version: "v0.33.1"
node_exporter_version: "v1.12.1"
pushgateway_version: "v1.11.3"
elasticsearch_exporter_version: "v1.11.0"
mysqld_exporter_version: "v0.19.0"
postgres_exporter_version: "v0.20.1"
nginx_exporter_version: "v1.5.1"
logstash_exporter_version: "v1.9.1"

# ELK stack
elasticsearch_version: "9.4.4"
logstash_version: "9.4.4"
kibana_version: "9.4.4"
elk_elasticsearch_exporter_port: 9114
logstash_exporter_port: 9198

# OpenTelemetry log collection
otel_collector_version: "v0.157.0"

# Base images
alpine_version: "3.24"
ubuntu_version: "24.04"
busybox_version: "1.38"
nginx_version: "1.31-alpine"
redis_version: "8.8-alpine"
postgres_version: "17-alpine"
mariadb_version: "12.3"
python_version: "3.14-slim"
node_version: "22-alpine"
golang_version: "1.26-alpine"

# node-exporter paths (certs issued by step-ca via certificates role)
node_exporter_server_cert: /etc/node-exporter/node-exporter.crt
node_exporter_server_key: /etc/node-exporter/node-exporter.key

# Certificates to generate on each host (processed by certificates role)
# certificates_extra is merged by pre_tasks in provisioning playbooks
certificates_extra_sans: []
certificates_extra: []
certificates:
  - name: "{{ vm_hostname }}"
    type: stepca
    extra_sans: "{{ certificates_extra_sans }}"
  - name: node-exporter
    type: stepca
    dir: /etc/node-exporter
    key_dir: /etc/node-exporter
    extra_sans:
      - "DNS:{{ vm_hostname }}.{{ lab_domain }}"
      - "DNS:{{ vm_hostname }}.homelab.internal"
      - "IP:{{ vm_ip }}"

# Firewall
firewall_backend: firewalld
firewall_ports:
  - 80/tcp
  - 443/tcp
  - 9100/tcp

firewall_podman_interfaces:
  - podman1
  - cni-podman0

# Controller /etc/hosts entries (derived from dns_records by provision-common.yml pre_tasks)
controller_hosts_entries: []

# Node exporter textfile collectors
node_exporter_textfile_scripts:
  - name: chrony.sh
    sudoers:
      - "nobody ALL=(root) NOPASSWD: /usr/bin/chronyc -c tracking"
  - name: fstab-check.sh
    sudoers:
      - "nobody ALL=(root) NOPASSWD: /usr/bin/test -f *"
      - "nobody ALL=(root) NOPASSWD: /usr/bin/grep *"
  - name: reboot-required.sh
    sudoers:
      - "nobody ALL=(root) NOPASSWD: /usr/bin/needs-restarting -r"
      - "nobody ALL=(root) NOPASSWD: /usr/bin/needs-restarting -s"
  - name: authorized-keys.sh
    sudoers: []
  - name: container-health.sh
    sudoers:
      - "nobody ALL=(root) NOPASSWD: /usr/bin/podman ps -a --format *"
      - "nobody ALL=(root) NOPASSWD: /usr/bin/podman stats --no-stream --format *"
  - name: logstash.sh
    sudoers: []
    groups: ["elk"]
  - name: step-ca-health.sh
    sudoers:
      - "nobody ALL=(root) NOPASSWD: /usr/bin/podman ps --filter *"
    groups: ["pki"]

# DNS records — single source of truth for all FQDN→IP mappings
# Used by libvirt dnsmasq (network.xml.j2) and Unbound (local-zones.conf.j2).
# certificates_extra_sans derived from this by provision-common.yml pre_tasks.
dns_domain: homelab.internal
dns_upstream_forwarders:
  - "1.1.1.1"
  - "1.0.0.1"
  - "8.8.8.8"
  - "8.8.4.4"
dns_records:
  harbor.homelab.internal: 192.168.100.10
  ansible01.homelab.internal: 192.168.100.10
  monitoring.homelab.internal: 192.168.100.11
  ansible02.homelab.internal: 192.168.100.11
  observability.homelab.internal: 192.168.100.12
  ansible03.homelab.internal: 192.168.100.12
  ca.homelab.internal: 192.168.100.13
  pki.homelab.internal: 192.168.100.13
  packages.homelab.internal: 192.168.100.13
  documents.homelab.internal: 192.168.100.13
  ansible04.homelab.internal: 192.168.100.13
