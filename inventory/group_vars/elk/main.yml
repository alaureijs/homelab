---
# ELK stack group variables (shared across elasticsearch, logstash, kibana roles)

# Shared paths
elk_config_dir: /etc/elk
elk_data_dir: /var/lib/elk
elk_cert_dir: /etc/pki/tls/certs
elk_key_dir: /etc/pki/tls/private

# Podman network
elk_network_name: elk

# Hostname
elk_hostname: observability.local.lan

# Access URLs
elk_kibana_url: "https://observability.local.lan/kibana/"
elk_elasticsearch_url: "https://observability.local.lan/elasticsearch/"
