---
# ELK stack group variables (shared across elasticsearch, logstash, kibana roles)

# Shared paths
elk_config_dir: /etc/elk
elk_data_dir: /var/lib/elk
elk_cert_dir: /etc/pki/tls/certs
elk_key_dir: /etc/pki/tls/private

# Podman network
elk_network_name: elk

# Hostname
elk_hostname: observability.homelab.internal

# Access URLs
elk_kibana_url: "https://observability.homelab.internal/kibana/"
elk_elasticsearch_url: "https://observability.homelab.internal/elasticsearch/"

# Elasticsearch HTTP port (used by logstash pipeline output and kibana connection)
elasticsearch_http_port: 9200

# Firewall
firewall_ports:
  - 80/tcp
  - 443/tcp
  - 9100/tcp
  - 9114/tcp

# Certificate SANs (uses default SANs from certificates role)
certificates_extra_sans:
  - "DNS:{{ vm_hostname }}.homelab.internal"
  - "DNS:observability.homelab.internal"
