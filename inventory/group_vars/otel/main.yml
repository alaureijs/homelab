---
# OpenTelemetry log collection

# Client certificate for mTLS to observability.homelab.internal/elasticsearch
# (issued by step-ca via certificates role in provision-common.yml)
# Distinct name from certificates_extra: Ansible replaces lists across groups,
# so portal group's certificates_extra would clobber this on ansible04.
# Kept outside /etc/otel-collector: collection install wipes that dir on upgrade.
otel_client_certificates:
  - name: otel-client
    type: stepca
    client: true
    dir: /etc/otel-client
    key_dir: /etc/otel-client
    extra_sans:
      - "DNS:{{ vm_hostname }}"
      - "DNS:{{ vm_hostname }}.{{ lab_domain }}"
