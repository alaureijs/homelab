---
# App-specific provisioning for ansible01 (Harbor).
# Common roles applied by provision-common.yml or the provision-ansible01.yml wrapper.
- name: Provision ansible01 for Harbor
  hosts: ansible01
  become: true
  gather_facts: true

  roles:
    - role: harbor
    - role: harbor_config

  post_tasks:
    - name: Mirror Trivy DB to Harbor
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../roles/harbor/tasks/trivy-db-mirror.yml"
