---
# Play 0: Common roles on all hosts
- name: Common roles on all hosts
  ansible.builtin.import_playbook: provision-common.yml

# Play 0.5: Update libvirt DNS on controller
- name: Update libvirt DNS entries
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  roles:
    - role: dns

# Play 1: Provision ansible04 for PKI, portal, and documents
- name: Provision ansible04 for PKI, portal, and documents
  hosts: ansible04
  become: true
  gather_facts: true

  roles:
    - role: step-ca
    - role: nginx

  post_tasks:
    - name: Get step-ca fingerprint
      ansible.builtin.shell: "step certificate fingerprint {{ step_ca_config_dir }}/certs/root_ca.crt"
      environment:
        STEPPATH: "{{ step_ca_config_dir }}"
      register: _portal_fingerprint
      changed_when: false
      failed_when: false

    - name: Set fingerprint fact
      ansible.builtin.set_fact:
        portal_fingerprint: "{{ _portal_fingerprint.stdout | default('unknown') }}"

    - name: Issue step-ca cert for portal
      ansible.builtin.shell: |
        step ca certificate \
          "pki.homelab.internal" \
          "{{ nginx_ssl_cert }}" \
          "{{ nginx_ssl_key }}" \
          --san "packages.homelab.internal" \
          --san "documents.homelab.internal" \
          --san "ansible04.homelab.internal" \
          --san "192.168.100.13" \
          --not-after 720h \
          --force \
          --provisioner admin \
          --provisioner-password-file <(echo "{{ vault_stepca_password }}")
      environment:
        STEPPATH: "{{ step_ca_config_dir }}"
      register: _portal_cert_issue
      changed_when: "'Your certificate has been saved' in _portal_cert_issue.stdout"
      notify: Reload nginx

    - name: Deploy root CA cert to web root
      ansible.builtin.copy:
        src: "{{ step_ca_config_dir }}/certs/root_ca.crt"
        dest: "{{ nginx_web_root }}/ca/root_ca.crt"
        remote_src: true
        owner: "{{ nginx_owner }}"
        group: nginx
        mode: "0644"

    - name: Deploy portal landing page
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/nginx/templates/index.html.j2"
        dest: "{{ nginx_web_root }}/ca-portal/index.html"
        owner: "{{ nginx_owner }}"
        group: "{{ nginx_group }}"
        mode: "0644"

    - name: Deploy documents landing page
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/nginx/templates/documents-index.html.j2"
        dest: "{{ nginx_web_root }}/documents/index.html"
        owner: "{{ nginx_owner }}"
        group: "{{ nginx_group }}"
        mode: "0644"

    - name: Reload nginx to pick up new vhosts and certs
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
