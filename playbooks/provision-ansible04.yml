---
# Play 0: Common roles on all hosts
- name: Common roles on all hosts
  ansible.builtin.import_playbook: provision-common.yml

# Play 0.5: Update libvirt DNS on controller
- name: Update libvirt DNS entries
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  roles:
    - role: dns

# Play 1: Provision ansible04 for PKI
- name: Provision ansible04 for PKI
  hosts: ansible04
  become: true
  gather_facts: true

  roles:
    - role: step-ca
    - role: ca-portal
