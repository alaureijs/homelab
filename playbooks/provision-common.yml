---
# Play 0: Manage controller /etc/hosts
- name: Update controller hosts file
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    - name: Derive /etc/hosts entries from dns_records
      ansible.builtin.set_fact:
        controller_hosts_entries: "{{ (_raw | from_json) }}"
      vars:
        _raw: >-
          {% set ns = namespace(entries=[]) %}
          {% for ip, items in (dns_records | dict2items | groupby('value')) %}
          {%   set fqdns = items | map(attribute='key') | sort | list %}
          {%   set short = fqdns | first | regex_replace('\..*$', '') %}
          {%   set _ = ns.entries.append(ip ~ ' ' ~ short ~ ' ' ~ fqdns | join(' ')) %}
          {% endfor %}
          {{ ns.entries | to_json }}

    - name: Remove stale ansible host entries from /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^{{ item.split(' ')[0] }}\\s"
        state: absent
      loop: "{{ controller_hosts_entries }}"

    - name: Ensure /etc/hosts entries for all hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
        state: present
      loop: "{{ controller_hosts_entries }}"

# Play 1: Common roles applied to all hosts
- name: Provision common roles on all hosts
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ vm_hostname }}"

    - name: Derive certificate SANs from dns_records
      ansible.builtin.set_fact:
        certificates_extra_sans: >-
          {{ dns_records | dict2items
             | selectattr('value', 'equalto', vm_ip | string)
             | map(attribute='key')
             | map('regex_replace', '^(.*)$', 'DNS:\1')
             | list }}

    - name: Merge certificates lists
      ansible.builtin.set_fact:
        certificates: "{{ certificates + certificates_extra | default([]) + otel_client_certificates | default([]) }}"

  roles:
    - role: common
    - role: firewall
    - role: certificates
    - role: podman
    - role: hardening
    - role: node_exporter
