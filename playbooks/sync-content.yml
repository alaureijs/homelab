---
- name: Download packages and exporter tarballs to internal package repo
  hosts: packages
  become: true
  gather_facts: true
  roles:
    - role: packages

- name: Sync and update container images to Harbor
  hosts: ansible01
  become: true
  gather_facts: true
  roles:
    - role: harbor_containers

- name: Copy sync reports to documents website
  hosts: portal
  become: true
  gather_facts: true
  run_once: true
  vars:
    docs_web_root: /var/www
    docs_owner: nobody
    docs_group: nobody
  tasks:
    - name: Ensure sync-reports directory exists
      ansible.builtin.file:
        path: "{{ docs_web_root }}/documents/sync-reports"
        state: directory
        owner: "{{ docs_owner }}"
        group: "{{ docs_group }}"
        mode: "0755"

    - name: Copy export report to documents
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../reports/exporters-report-{{ ansible_date_time.date }}.yml"
        dest: "{{ docs_web_root }}/documents/sync-reports/exporters-report-{{ ansible_date_time.date }}.yml"
        owner: "{{ docs_owner }}"
        group: "{{ docs_group }}"
        mode: "0644"
      ignore_errors: true

    - name: Copy sync report to documents
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../reports/sync-report-{{ ansible_date_time.date }}.yml"
        dest: "{{ docs_web_root }}/documents/sync-reports/sync-report-{{ ansible_date_time.date }}.yml"
        owner: "{{ docs_owner }}"
        group: "{{ docs_group }}"
        mode: "0644"
      ignore_errors: true
