---
- name: Download Prometheus exporter tarballs from GitHub
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: prometheus_exporters

- name: Upload exporters and textfile scripts to internal package repo
  hosts: ansible04
  become: true
  gather_facts: true
  roles:
    - role: packages

- name: Sync and update container images to Harbor
  hosts: ansible01
  become: true
  gather_facts: true
  roles:
    - role: harbor_containers
