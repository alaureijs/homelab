---
- name: Create web root directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ ca_portal_web_root }}"
    - "{{ ca_portal_ca_dir }}"
    - "{{ ca_portal_acme_dir }}"

- name: Get step-ca fingerprint
  ansible.builtin.shell: "step certificate fingerprint {{ step_ca_config_dir }}/certs/root_ca.crt"
  environment:
    STEPPATH: "{{ step_ca_config_dir }}"
  register: _ca_portal_fingerprint
  changed_when: false
  failed_when: false

- name: Set fingerprint fact
  ansible.builtin.set_fact:
    ca_portal_fingerprint: "{{ _ca_portal_fingerprint.stdout | default('unknown') }}"

- name: Issue step-ca cert for portal
  ansible.builtin.shell: |
    step ca certificate \
      "{{ ca_portal_hostname }}" \
      "{{ ca_portal_ssl_cert }}" \
      "{{ ca_portal_ssl_key }}" \
      --san "packages.homelab.internal" \
      --san "ansible04.homelab.internal" \
      --san "192.168.100.13" \
      --not-after 720h \
      --force \
      --provisioner admin \
      --provisioner-password-file <(echo "{{ vault_stepca_password }}")
  environment:
    STEPPATH: "{{ step_ca_config_dir }}"
  register: _ca_portal_issue
  changed_when: "'Your certificate has been saved' in _ca_portal_issue.stdout"
  notify: Reload nginx

- name: Deploy root CA cert to web root
  ansible.builtin.copy:
    src: "{{ step_ca_config_dir }}/certs/root_ca.crt"
    dest: "{{ ca_portal_ca_dir }}/root_ca.crt"
    remote_src: true
    owner: root
    group: nginx
    mode: "0644"

- name: Deploy nginx vhost config
  ansible.builtin.template:
    src: ca-portal.conf.j2
    dest: "{{ ca_portal_nginx_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy portal landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ ca_portal_web_root }}/index.html"
    owner: root
    group: root
    mode: "0644"


