---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check full packages installed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/bin/curl
        - /usr/bin/wget
        - /usr/bin/git
        - /usr/bin/vim
        - /usr/sbin/lvm
      register: pkg

    - name: Assert full packages installed
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Package not installed: {{ item.item }}"
      loop: "{{ pkg.results }}"

    - name: Check removed package absent
      ansible.builtin.stat:
        path: /usr/bin/nano
      register: nano_bin

    - name: Assert removed package absent
      ansible.builtin.assert:
        that: not nano_bin.stat.exists
        fail_msg: "nano should have been removed"

    - name: Check chronyd binary exists
      ansible.builtin.stat:
        path: /usr/sbin/chronyd
      register: chronyd_bin

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert chronyd package installed but not running
      ansible.builtin.assert:
        that:
          - chronyd_bin.stat.exists
          - "'chronyd.service' not in ansible_facts.services or ansible_facts.services['chronyd.service'].state != 'running'"
        fail_msg: "chronyd package missing or service state unexpected"

    - name: Check all logrotate configs
      ansible.builtin.stat:
        path: "/etc/logrotate.d/{{ item }}"
      loop:
        - harbor
        - elk
        - custom
      register: logrotate_conf

    - name: Assert all logrotate configs deployed
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Logrotate config missing: {{ item.item }}"
      loop: "{{ logrotate_conf.results }}"
