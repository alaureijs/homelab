---
# DNS role defaults
# Updates libvirt network with DNS entries (forwarders, domain, local zones)

# Libvirt network parameters (mirrors libvirt role defaults)
dns_libvirt_network_name: ansible-net
dns_libvirt_network_bridge: virbr-ansible
dns_libvirt_network_forward: nat
dns_libvirt_network_forward_interface: wlan0
dns_libvirt_network_gateway: "{{ vm_gateway | default('192.168.100.1') }}"
dns_libvirt_network_dhcp_enabled: true
dns_libvirt_uri: qemu:///system
