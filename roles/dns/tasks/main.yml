---
# Update libvirt network with DNS entries
# Uses the same network.xml.j2 template as the libvirt role
# Destroys and recreates network to apply DNS changes

- name: Set libvirt network variables for template
  ansible.builtin.set_fact:
    libvirt_network_name: "{{ dns_libvirt_network_name }}"
    libvirt_network_bridge: "{{ dns_libvirt_network_bridge }}"
    libvirt_network_forward: "{{ dns_libvirt_network_forward }}"
    libvirt_network_forward_interface: "{{ dns_libvirt_network_forward_interface }}"
    libvirt_network_gateway: "{{ dns_libvirt_network_gateway }}"
    libvirt_network_dhcp_enabled: "{{ dns_libvirt_network_dhcp_enabled }}"

- name: Render DNS network XML
  ansible.builtin.set_fact:
    _dns_network_xml: "{{ lookup('template', playbook_dir ~ '/../roles/libvirt/templates/network.xml.j2') }}"

- name: Destroy libvirt network
  community.libvirt.virt_net:
    command: destroy
    name: "{{ dns_libvirt_network_name }}"
    uri: "{{ dns_libvirt_uri }}"

- name: Define libvirt network with DNS entries
  community.libvirt.virt_net:
    command: define
    name: "{{ dns_libvirt_network_name }}"
    xml: "{{ _dns_network_xml }}"
    uri: "{{ dns_libvirt_uri }}"

- name: Start libvirt network
  community.libvirt.virt_net:
    state: active
    name: "{{ dns_libvirt_network_name }}"
    uri: "{{ dns_libvirt_uri }}"

- name: Enable libvirt network autostart
  community.libvirt.virt_net:
    autostart: true
    name: "{{ dns_libvirt_network_name }}"
    uri: "{{ dns_libvirt_uri }}"
