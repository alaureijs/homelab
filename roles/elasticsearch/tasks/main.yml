---
- name: Create Elasticsearch directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ elk_config_dir }}"
    - "{{ elk_data_dir }}"
    - "{{ elasticsearch_data_dir }}"

- name: Render Elasticsearch configuration
  ansible.builtin.template:
    src: "{{ elasticsearch_config_template }}"
    dest: /tmp/elasticsearch.yml
  notify: Restart Elasticsearch

- name: Read Elasticsearch configuration
  ansible.builtin.slurp:
    src: /tmp/elasticsearch.yml
  register: elk_cm_elasticsearch

- name: Create Elasticsearch log directory
  ansible.builtin.file:
    path: /var/log/elk
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy rsyslog config for Elasticsearch
  ansible.builtin.copy:
    content: |
      template(name="ElkLogFile" type="string" string="/var/log/elk/%programname%.log")
      if $programname == "elasticsearch" then {
          action(type="omfile" dynaFile="ElkLogFile"
                 fileCreateMode="0644" dirCreateMode="0755")
          stop
      }
    dest: /etc/rsyslog.d/31-elasticsearch.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Deploy logrotate config for ELK logs
  ansible.builtin.copy:
    content: |
      /var/log/elk/*.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
          dateext
          dateformat -%Y%m%d
      }
    dest: /etc/logrotate.d/elk
    owner: root
    group: root
    mode: "0644"

- name: Ensure Podman auth directory exists
  ansible.builtin.file:
    path: /root/.config/containers
    state: directory
    mode: "0700"

- name: Write Podman auth for Harbor
  ansible.builtin.copy:
    content: |
      {
        "auths": {
          "{{ harbor_hostname }}": {
            "auth": "{{ ('ansible-sync:' + vault_harbor_sync_password) | b64encode }}"
          }
        }
      }
    dest: /root/.config/containers/auth.json
    mode: "0600"
  no_log: true

- name: Fetch Harbor certificate from ansible01
  ansible.builtin.slurp:
    src: /etc/pki/tls/certs/harbor.crt
  delegate_to: ansible01
  register: elasticsearch_harbor_cert

- name: Write Harbor certificate for system trust
  ansible.builtin.copy:
    content: "{{ elasticsearch_harbor_cert.content | b64decode }}"
    dest: /etc/pki/ca-trust/source/anchors/harbor.crt
    mode: "0644"
  register: elasticsearch_harbor_cert_trust

- name: Update CA trust
  ansible.builtin.command: update-ca-trust
  changed_when: elasticsearch_harbor_cert_trust.changed

- name: Create containers certs directory for Harbor
  ansible.builtin.file:
    path: "/etc/containers/certs.d/{{ harbor_hostname }}"
    state: directory
    mode: "0755"

- name: Write Harbor certificate for containers
  ansible.builtin.copy:
    content: "{{ elasticsearch_harbor_cert.content | b64decode }}"
    dest: "/etc/containers/certs.d/{{ harbor_hostname }}/ca.crt"
    mode: "0644"

- name: Create Podman network for ELK
  containers.podman.podman_network:
    name: "{{ elk_network_name }}"
    state: present
  register: elasticsearch_network

- name: Set data directory permissions for Elasticsearch
  ansible.builtin.file:
    path: "{{ elasticsearch_data_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  when: elasticsearch_network is changed

- name: Template Elasticsearch pod manifest
  ansible.builtin.template:
    src: elasticsearch-pod.yml.j2
    dest: "{{ elk_config_dir }}/elasticsearch-pod.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Elasticsearch

- name: Deploy Elasticsearch pod
  ansible.builtin.shell: |
    podman kube play --down {{ elk_config_dir }}/elasticsearch-pod.yml 2>/dev/null || true
    podman kube play --network host {{ elk_config_dir }}/elasticsearch-pod.yml
    chown -R 1000:1000 {{ elasticsearch_data_dir }}
    podman restart elasticsearch-elasticsearch
  args:
    executable: /bin/bash
  register: elasticsearch_kube
  changed_when: "'Pod' in elasticsearch_kube.stdout or 'Container' in elasticsearch_kube.stdout"
