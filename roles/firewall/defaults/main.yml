---
# firewall role defaults
#
# Backend: firewalld | nftables | iptables | auto
# auto = prefer firewalld > nftables > iptables
firewall_backend: auto

firewall_valid_backends:
  - auto
  - firewalld
  - iptables
  - nftables
  - ufw
  - none

# Common
firewall_ports:
  - 80/tcp
  - 443/tcp

firewall_services:
  - ssh

# Sources (CIDRs) to assign to the trusted zone
firewall_trusted_sources: []

# Additional interfaces to assign to the trusted zone (e.g. vxlan.calico)
firewall_trusted_interfaces: []

# firewalld policy objects for the forward path
# each item: {name, ingress_zone, egress_zone, target, priority}
firewall_forward_policies: []

# Service-to-port mapping for nftables/iptables backends
firewall_service_port_map:
  ssh: "22"
  http: "80"
  https: "443"
