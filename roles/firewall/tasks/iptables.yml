---
- name: Install iptables
  ansible.builtin.dnf:
    name:
      - iptables
      - iptables-services
    state: present

- name: Flush existing rules
  ansible.builtin.iptables:
    chain: INPUT
    flush: true

- name: Set default INPUT policy to DROP
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP

- name: Set default FORWARD and OUTPUT policy to ACCEPT
  ansible.builtin.iptables:
    chain: "{{ item }}"
    policy: ACCEPT
  loop:
    - FORWARD
    - OUTPUT

- name: Accept established and related connections
  ansible.builtin.iptables:
    chain: INPUT
    ctstate:
      - ESTABLISHED
      - RELATED
    jump: ACCEPT

- name: Accept loopback interface
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT

- name: Allow ICMP
  ansible.builtin.iptables:
    chain: INPUT
    protocol: icmp
    jump: ACCEPT

- name: Open TCP ports
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item | regex_replace('/tcp$', '') }}"
    jump: ACCEPT
  loop: "{{ firewall_ports | select('match', '.*/tcp$') | list }}"

- name: Open UDP ports
  ansible.builtin.iptables:
    chain: INPUT
    protocol: udp
    destination_port: "{{ item | regex_replace('/udp$', '') }}"
    jump: ACCEPT
  loop: "{{ firewall_ports | select('match', '.*/udp$') | list }}"

- name: Open service ports
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ firewall_service_port_map[item] }}"
    jump: ACCEPT
  loop: "{{ firewall_services }}"

- name: Trust Podman bridge interface
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: "{{ item }}"
    jump: ACCEPT
  loop: "{{ firewall_podman_interfaces | default([]) }}"

- name: Persist iptables rules
  ansible.builtin.shell: iptables-save > /etc/sysconfig/iptables
  changed_when: true
  notify: Reload iptables
