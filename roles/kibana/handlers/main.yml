---
- name: Restart Kibana
  ansible.builtin.shell: |
    podman kube play --down {{ elk_config_dir }}/kibana-pod.yml 2>/dev/null || true
    podman kube play --network {{ elk_network_name }} {{ elk_config_dir }}/kibana-pod.yml
  args:
    executable: /bin/bash
  changed_when: true

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
