---
# kubernetes role defaults

kubernetes_repo_version: "{{ k8s_version.split('.')[:2] | join('.') }}"
kubernetes_repo_baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_repo_version }}/rpm/"
kubernetes_repo_gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_repo_version }}/rpm/repodata/repomd.xml.key"

kubernetes_packages:
  - kubelet-{{ k8s_version }}
  - kubeadm-{{ k8s_version }}
  - kubectl-{{ k8s_version }}
  - cri-tools

kubernetes_containerd_version: "{{ containerd_version }}"
kubernetes_sandbox_image: registry.k8s.io/pause:3.10

kubernetes_control_plane_host: "{{ k8s_apiserver_host }}"
kubernetes_control_plane_port: 6443

kubernetes_join_token_ttl: 2h

# kube-proxy: nftables backend, deployed by kubeadm addon phase
kubernetes_kube_proxy_mode: nftables
kubernetes_kubeadm_config_path: /etc/kubernetes/kubeadm-config.yaml

# Calico CNI (operator-based, replaces Cilium)
kubernetes_calico_version: "{{ calico_version }}"
kubernetes_calico_manifest_dir: /etc/kubernetes/calico
kubernetes_calico_operator_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ kubernetes_calico_version }}/manifests/tigera-operator.yaml"
kubernetes_calico_operator_namespace: tigera-operator
kubernetes_calico_system_namespace: calico-system
kubernetes_calico_ip_pool: "{{ calico_ip_pool | default(pod_network_cidr) }}"
kubernetes_calico_mtu: "{{ calico_mtu | default(1450) }}"
kubernetes_calico_nat_outgoing: "{{ calico_nat_outgoing | default(true) }}"
kubernetes_calico_node_interface: "{{ calico_node_interface | default('enp1s0') }}"
kubernetes_calico_vxlan_port: 4789
