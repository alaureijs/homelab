---
- name: Add Kubernetes yum repository
  ansible.builtin.yum_repository:
    name: kubernetes-{{ kubernetes_repo_version }}
    description: Kubernetes {{ kubernetes_repo_version }} repository
    baseurl: "{{ kubernetes_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ kubernetes_repo_gpgkey }}"
    enabled: true

- name: Install EPEL for containerd
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install containerd
  ansible.builtin.dnf:
    name: "containerd-{{ kubernetes_containerd_version }}"
    state: present

- name: Install runc
  ansible.builtin.dnf:
    name: runc
    state: present

- name: Configure containerd (SystemdCgroup)
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Install kubelet, kubeadm, kubectl, cri-tools
  ansible.builtin.dnf:
    name: "{{ kubernetes_packages }}"
    state: present

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: Check if control plane already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/super-admin.conf
  register: kubernetes_admin_conf
  when: inventory_hostname in groups['k8s_cp']

- name: Render kubeadm init configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ kubernetes_kubeadm_config_path }}"
    mode: "0644"
  when: inventory_hostname in groups['k8s_cp']

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    cmd: kubeadm init --config {{ kubernetes_kubeadm_config_path }}
    creates: /etc/kubernetes/super-admin.conf
  register: kubernetes_init
  when: inventory_hostname in groups['k8s_cp']

- name: Ensure controller kubeconfig directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: inventory_hostname in groups['k8s_cp']

- name: Copy super-admin.conf to controller kubeconfig
  ansible.builtin.fetch:
    src: /etc/kubernetes/super-admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: true
  when: inventory_hostname in groups['k8s_cp']

- name: Set controller kubeconfig permissions
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: inventory_hostname in groups['k8s_cp']

- name: Generate kubeadm join command
  ansible.builtin.command:
    cmd: kubeadm token create --ttl {{ kubernetes_join_token_ttl }} --print-join-command
  register: kubernetes_join_cmd
  run_once: true
  delegate_to: "{{ groups['k8s_cp'] | first }}"
  changed_when: false

- name: Check if worker already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubernetes_kubelet_conf
  when: inventory_hostname in groups['k8s_workers']

- name: Join worker nodes to the cluster
  ansible.builtin.command:
    cmd: "{{ kubernetes_join_cmd.stdout }}"
    creates: /etc/kubernetes/kubelet.conf
  when: inventory_hostname in groups['k8s_workers']

- name: Check if kube-proxy DaemonSet exists
  ansible.builtin.command:
    cmd: kubectl get daemonset kube-proxy -n kube-system --no-headers
  environment:
    KUBECONFIG: /etc/kubernetes/super-admin.conf
  register: kubernetes_kube_proxy_ds
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups['k8s_cp']

- name: Provision kube-proxy addon (nftables)
  ansible.builtin.command:
    cmd: kubeadm init phase addon kube-proxy --config {{ kubernetes_kubeadm_config_path }}
  changed_when: true
  when:
    - inventory_hostname in groups['k8s_cp']
    - kubernetes_kube_proxy_ds.rc != 0

- name: Install Helm on control plane
  ansible.builtin.dnf:
    name: helm
    state: present
  when: inventory_hostname in groups['k8s_cp']

- name: Ensure Calico manifest directory
  ansible.builtin.file:
    path: "{{ kubernetes_calico_manifest_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['k8s_cp']

- name: Download tigera-operator manifest
  ansible.builtin.get_url:
    url: "{{ kubernetes_calico_operator_url }}"
    dest: "{{ kubernetes_calico_manifest_dir }}/tigera-operator.yaml"
    mode: "0644"
    force: false
  when: inventory_hostname in groups['k8s_cp']

- name: Apply tigera-operator
  ansible.builtin.command:
    cmd: kubectl apply -f {{ kubernetes_calico_manifest_dir }}/tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/super-admin.conf
  register: kubernetes_calico_operator_apply
  changed_when: "kubernetes_calico_operator_apply.stdout | regex_search('configured|created') | bool"
  when: inventory_hostname in groups['k8s_cp']

- name: Wait for tigera-operator deployment
  ansible.builtin.command:
    cmd: kubectl -n {{ kubernetes_calico_operator_namespace }} rollout status deployment/tigera-operator --timeout=240s
  environment:
    KUBECONFIG: /etc/kubernetes/super-admin.conf
  register: kubernetes_calico_tigera
  changed_when: false
  retries: 6
  delay: 10
  until: kubernetes_calico_tigera.rc == 0
  when: inventory_hostname in groups['k8s_cp']

- name: Render Calico Installation manifest
  ansible.builtin.template:
    src: calico-installation.yaml.j2
    dest: "{{ kubernetes_calico_manifest_dir }}/installation.yaml"
    mode: "0644"
  when: inventory_hostname in groups['k8s_cp']

- name: Apply Calico Installation
  ansible.builtin.command:
    cmd: kubectl apply -f {{ kubernetes_calico_manifest_dir }}/installation.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/super-admin.conf
  register: kubernetes_calico_install
  changed_when: "kubernetes_calico_install.stdout | regex_search('configured|created') | bool"
  when: inventory_hostname in groups['k8s_cp']

- name: Wait for calico-node daemonset rollout
  ansible.builtin.command:
    cmd: kubectl -n {{ kubernetes_calico_system_namespace }} rollout status daemonset/calico-node --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/super-admin.conf
  register: kubernetes_calico_node
  changed_when: false
  retries: 10
  delay: 15
  until: kubernetes_calico_node.rc == 0
  when: inventory_hostname in groups['k8s_cp']

- name: Wait for calico-kube-controllers deployment
  ansible.builtin.command:
    cmd: kubectl -n {{ kubernetes_calico_system_namespace }} rollout status deployment/calico-kube-controllers --timeout=240s
  environment:
    KUBECONFIG: /etc/kubernetes/super-admin.conf
  register: kubernetes_calico_controllers
  changed_when: false
  retries: 6
  delay: 10
  until: kubernetes_calico_controllers.rc == 0
  when: inventory_hostname in groups['k8s_cp']

- name: Wait for all nodes Ready
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Ready node --all --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/super-admin.conf
  register: kubernetes_ready
  changed_when: false
  retries: 10
  delay: 15
  until: kubernetes_ready.rc == 0
  when: inventory_hostname in groups['k8s_cp']
