---
- name: Restart Logstash
  ansible.builtin.shell: |
    podman kube play --down {{ elk_config_dir }}/logstash-pod.yml 2>/dev/null || true
    podman kube play --network {{ elk_network_name }} {{ elk_config_dir }}/logstash-pod.yml
  args:
    executable: /bin/bash
  changed_when: true

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
