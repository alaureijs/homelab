---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Create certificate directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/pki/tls/certs
        - /etc/pki/tls/private

    - name: Generate self-signed test certificate
      ansible.builtin.command: openssl req -x509 -newkey rsa:2048 -nodes \
        -keyout /etc/pki/tls/private/molecule-test.key \
        -out /etc/pki/tls/certs/molecule-test.crt \
        -days 365 \
        -subj "/CN=molecule-test.local" \
        -addext "subjectAltName=DNS:molecule-test.local"
      args:
        creates: /etc/pki/tls/certs/molecule-test.crt
