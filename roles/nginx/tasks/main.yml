---
- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Remove default nginx server block
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: Create web root base directory
  ansible.builtin.file:
    path: "{{ nginx_web_root }}"
    state: directory
    owner: "{{ nginx_owner }}"
    group: "{{ nginx_group }}"
    mode: "{{ nginx_dir_mode }}"

- name: Create web root subdirectories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(nginx_owner) }}"
    group: "{{ item.group | default(nginx_group) }}"
    mode: "{{ item.mode | default(nginx_dir_mode) }}"
  loop: "{{ nginx_directories }}"

- name: Deploy vhost configs
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ vhost.template }}"
    dest: "{{ vhost.conf }}"
    owner: "{{ nginx_owner }}"
    group: "{{ nginx_group }}"
    mode: "0644"
  loop: "{{ nginx_vhosts }}"
  loop_control:
    loop_var: vhost
  notify: Reload nginx

- name: Ensure nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
