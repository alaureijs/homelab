---
- name: Ensure repo subdirectories exist
  ansible.builtin.file:
    path: "{{ packages_repo_dir }}/{{ item }}"
    state: directory
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "{{ packages_repo_mode }}"
  loop:
    - exporters
    - node-exporter/textfile_scripts
    - harbor
    - rpm
    - images

- name: Download packages from upstream
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ packages_repo_dir }}/{{ item.dest }}/{{ item.filename | default(item.url | basename) }}"
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "0644"
    timeout: 300
  loop: "{{ packages_files }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"

- name: Check GitHub for latest exporter version
  ansible.builtin.shell: |
    set -euo pipefail
    REPO="{{ item.repo }}"
    CURRENT="{{ item.version | regex_replace('^v', '') }}"
    LATEST=$(curl -sf "https://api.github.com/repos/$REPO/releases/latest" \
      | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")
    if [ -z "$LATEST" ]; then
      LATEST=$(curl -sf "https://api.github.com/repos/$REPO/releases" \
        | python3 -c "
    import sys, json
    releases = json.load(sys.stdin)
    for r in releases:
        if not r.get('prerelease', False):
            print(r.get('tag_name',''))
            break
    else:
        print('')
    " 2>/dev/null || echo "")
    fi
    STRIPPED=$(echo "$LATEST" | sed 's/^v//')
    if [ -z "$LATEST" ]; then
      echo "NONE"
    elif [ "$STRIPPED" = "$CURRENT" ]; then
      echo "$LATEST|false"
    else
      echo "$LATEST|true"
    fi
  args:
    executable: /bin/bash
  loop: "{{ packages_exporters }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  register: packages_exporter_versions

- name: Build exporter info dict
  ansible.builtin.set_fact:
    packages_exporter_info: >-
      {{ packages_exporter_info | default({}) | combine({
           _result.item.name: {
             'name': _result.item.name,
             'tag': (_result.stdout | default('NONE') | split('|') | first),
             'needs_update': (_result.stdout | default('NONE') | split('|') | last == 'true'),
             'repo': _result.item.repo,
             'filename': _result.item.get('file', '') or
                         (_result.item.name ~ '-' ~
                          (_result.stdout | default('NONE') | split('|') | first | regex_replace('^v', '')) ~ '.' ~
                          packages_exporter_arch ~ '.tar.gz')
           }
         }) }}
  loop: "{{ packages_exporter_versions.results }}"
  loop_control:
    label: "{{ _result.item.name }}: {{ _result.stdout | default('?') }}"
    loop_var: _result

- name: Download pinned exporter version from GitHub
  ansible.builtin.get_url:
    url: "https://github.com/{{ item.repo }}/releases/download/{{ item.version }}/{{ _filename }}"
    dest: "{{ packages_repo_dir }}/exporters/{{ _filename }}"
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "0644"
    timeout: 120
  loop: "{{ packages_exporters }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  vars:
    _filename: "{{ item.file | default(item.name ~ '-' ~ (item.version | regex_replace('^v', '')) ~ '.' ~ packages_exporter_arch ~ '.tar.gz') }}"

- name: Download latest exporter version if newer than pinned
  ansible.builtin.get_url:
    url: "https://github.com/{{ info.repo }}/releases/download/{{ info.tag }}/{{ info.filename }}"
    dest: "{{ packages_repo_dir }}/exporters/{{ info.filename }}"
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "0644"
    timeout: 120
  loop: "{{ packages_exporter_info | default({}) | dict2items }}"
  loop_control:
    label: "{{ info.name }} {{ info.tag }}"
  vars:
    info: "{{ item.value }}"
  when: info.needs_update

- name: Upload textfile collector scripts  # noqa: no-relative-paths
  ansible.builtin.copy:
    src: "{{ role_path }}/../../files/node-exporter/textfile_scripts/{{ item.name }}"
    dest: "{{ packages_repo_dir }}/node-exporter/textfile_scripts/{{ item.name }}"
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "0755"
  loop: "{{ node_exporter_textfile_scripts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Build exporter report
  ansible.builtin.set_fact:
    packages_exporter_report: >-
      {{ packages_exporter_report | default({}) | combine({
           item.name: {
             'current_version': item.version,
             'latest_version': packages_exporter_info[item.name].tag,
             'update_available': packages_exporter_info[item.name].needs_update
           }
         }) }}
  loop: "{{ packages_exporters }}"
  loop_control:
    label: "{{ item.name }}"
  when: packages_exporter_info is defined

- name: Ensure reports directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../reports"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Write exporter report
  ansible.builtin.copy:
    content: "{{ packages_exporter_report | default({}) | to_nice_yaml }}"
    dest: "{{ playbook_dir }}/../reports/exporters-report-{{ ansible_date_time.date }}.yml"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: packages_exporter_report is defined

- name: Display exporter summary
  ansible.builtin.debug:
    msg: |
      Packages Exporter Report
      ========================
      {% for name, info in packages_exporter_report.items() %}
      {{ name }}:{{ info.current_version }}
        Latest: {{ info.latest_version }}
        Update: {{ 'YES (' + info.latest_version + ')' if info.update_available else 'no' }}
      {% endfor %}

      Report saved to:
        reports/exporters-report-{{ ansible_date_time.date }}.yml
  when: packages_exporter_report is defined

- name: List downloaded packages
  ansible.builtin.find:
    paths: "{{ packages_repo_dir }}"
    recurse: true
    file_type: file
  register: packages_packages_list

- name: Show package count
  ansible.builtin.debug:
    msg: "{{ packages_packages_list.files | length }} packages in {{ packages_repo_dir }}"
