---
- name: Ensure base packages directory exists
  ansible.builtin.file:
    path: "{{ packages_repo_dir }}"
    state: directory
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "{{ packages_repo_mode }}"

- name: Ensure exporters directory exists
  ansible.builtin.file:
    path: "{{ packages_repo_dir }}/exporters"
    state: directory
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "{{ packages_repo_mode }}"

- name: Ensure node-exporter textfile scripts directory exists
  ansible.builtin.file:
    path: "{{ packages_repo_dir }}/node-exporter/textfile_scripts"
    state: directory
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "{{ packages_repo_mode }}"

- name: Check if exporter cache dir exists on controller
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../files/prometheus/exporters"
  delegate_to: localhost
  become: false
  register: _cache_dir

- name: Copy exporter tarballs from controller cache to repo
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/prometheus/exporters/{{ item.file | default(item.name ~ '-' ~ (item.version | regex_replace('^v', '')) ~ '.' ~ prometheus_exporters_arch ~ '.tar.gz') }}"
    dest: "{{ packages_repo_dir }}/exporters/"
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "0644"
  loop: "{{ prometheus_exporters }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  when: _cache_dir.stat.exists

- name: Upload textfile collector scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/node-exporter/textfile_scripts/{{ item.name }}"
    dest: "{{ packages_repo_dir }}/node-exporter/textfile_scripts/{{ item.name }}"
    owner: "{{ packages_repo_owner }}"
    group: "{{ packages_repo_group }}"
    mode: "0755"
  loop: "{{ node_exporter_textfile_scripts }}"
  loop_control:
    label: "{{ item.name }}"

- name: List downloaded packages
  ansible.builtin.find:
    paths: "{{ packages_repo_dir }}"
    recurse: true
    file_type: file
  register: _packages_list

- name: Show package count
  ansible.builtin.debug:
    msg: "{{ _packages_list.files | length }} packages in {{ packages_repo_dir }}"
