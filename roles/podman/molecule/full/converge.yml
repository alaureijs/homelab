---
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    podman_packages:
      - podman
      - python3-packaging
      - buildah
      - skopeo
    podman_pip_packages:
      - podman-compose
    podman_enable_socket: true
    podman_registries:
      - docker.io
      - quay.io
      - ghcr.io

  roles:
    - role: podman
