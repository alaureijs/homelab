---
- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Remove default nginx server block
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: Ensure nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
